<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ModulAI</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var el = document.createElement('div');
        el.style = 'color: red; padding: 20px; font-family: monospace; background: #fff; z-index: 9999; position: fixed; top: 0; left: 0; right: 0; bottom: 0;';
        el.innerHTML = '<h3>React crashed!</h3><p>' + msg + '</p><pre>' + (error && error.stack) + '</pre>';
        document.body.appendChild(el);
      };
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
